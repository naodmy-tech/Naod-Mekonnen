<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#0369a1" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Rounded App Icon Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Inner subtle glow ring -->
  <rect x="16" y="16" width="480" height="480" rx="96" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="4" />

  <!-- Digital Network Nodes & Circuits background -->
  <g opacity="0.25" stroke="#38bdf8" stroke-width="2">
    <line x1="80" y1="120" x2="200" y2="120" />
    <line x1="200" y1="120" x2="256" y2="180" />
    <line x1="312" y1="180" x2="432" y2="180" />
    <line x1="120" y1="380" x2="200" y2="340" />
    <line x1="200" y1="340" x2="312" y2="340" />
    <line x1="312" y1="340" x2="392" y2="380" />
    <circle cx="80" cy="120" r="5" fill="#38bdf8" />
    <circle cx="200" cy="120" r="5" fill="#38bdf8" />
    <circle cx="432" cy="180" r="5" fill="#38bdf8" />
    <circle cx="120" cy="380" r="5" fill="#38bdf8" />
    <circle cx="392" cy="380" r="5" fill="#38bdf8" />
  </g>

  <!-- Central Symbol: Ledger / Database Cylinders + Shield / Book -->
  <g filter="url(#shadow)">
    <!-- Database Cylinder 1 (Top) -->
    <path d="M176 150 C176 135 256 125 256 125 C256 125 336 135 336 150 C336 165 256 175 256 175 C256 175 176 165 176 150 Z" fill="url(#accentGrad)" />
    
    <!-- Ledger Book & Database Stack -->
    <path d="M150 200 L256 245 L362 200 L362 310 L256 360 L150 310 Z" fill="#ffffff" />
    <path d="M150 200 L256 245 L256 360 L150 310 Z" fill="#e2e8f0" />
    <path d="M256 245 L362 200 L362 310 L256 360 Z" fill="#f8fafc" />

    <!-- Ledger lines on book pages -->
    <line x1="180" y1="240" x2="235" y2="265" stroke="#94a3b8" stroke-width="3" stroke-linecap="round" />
    <line x1="180" y1="260" x2="235" y2="285" stroke="#94a3b8" stroke-width="3" stroke-linecap="round" />
    <line x1="180" y1="280" x2="235" y2="305" stroke="#94a3b8" stroke-width="3" stroke-linecap="round" />

    <line x1="277" y1="265" x2="332" y2="240" stroke="#0284c7" stroke-width="3" stroke-linecap="round" />
    <line x1="277" y1="285" x2="332" y2="260" stroke="#0284c7" stroke-width="3" stroke-linecap="round" />
    <line x1="277" y1="305" x2="332" y2="280" stroke="#0284c7" stroke-width="3" stroke-linecap="round" />

    <!-- Center Graduation Cap / Academic Symbol -->
    <polygon points="256,120 330,150 256,180 182,150" fill="url(#goldGrad)" />
    <path d="M205 163 L205 190 C205 205 307 205 307 190 L307 163" fill="none" stroke="url(#goldGrad)" stroke-width="5" />
    <path d="M325 152 L340 185 L340 215" fill="none" stroke="#fbbf24" stroke-width="3" />
    <circle cx="340" cy="218" r="4" fill="#fbbf24" />
  </g>

  <!-- Title Badge / University Text -->
  <g text-anchor="middle" font-family="system-ui, -apple-system, sans-serif">
    <rect x="136" y="385" width="240" height="42" rx="21" fill="rgba(15, 23, 42, 0.85)" stroke="#38bdf8" stroke-width="2" />
    <text x="256" y="413" fill="#ffffff" font-size="20" font-weight="800" letter-spacing="3">WOLLO AIS</text>
    <text x="256" y="455" fill="#bae6fd" font-size="14" font-weight="600" letter-spacing="1">AcFn 4121 • 4th Year</text>
  </g>
</svg>
